style=\"font-family: 宋体;\"\u003E：招商手册、招商指南\u003C\u002Fspan\u003E\u003C\u002Fli\u003E\u003Cli\u003E\u003Cspan style=\"font-family: 宋体;\"\u003E\u003Cstrong\u003E培训体系\u003C\u002Fstrong\u003E\u003C\u002Fspan\u003E\u003Cspan style=\"font-family: 宋体;\"\u003E：参赛攻略、课程沙龙、开源资料\u003C\u002Fspan\u003E\u003C\u002Fli\u003E\u003C\u002Ful\u003E\u003Cp\u003EWelcome to the RoboMaster Rules\u002FResource Center! The RoboMaster Organizing Committee builds and maintains this site to provide participants with streamlined access to all essential official resources. You can quickly locate the content you need through the \u003Cstrong\u003Eleft-hand navigation or the search function\u003C\u002Fstrong\u003E. We hope this platform will become your go-to resource for preparation and learning, empowering every team to achieve breakthroughs and growth.\u003C\u002Fp\u003E\u003Cp\u003EContent Coverage\u003C\u002Fp\u003E\u003Cul\u003E\u003Cli\u003E\u003Cstrong\u003ERulebooks:\u003C\u002Fstrong\u003E rules manuals, robot building specifications manual, participant manuals, serial protocol\u003C\u002Fli\u003E\u003Cli\u003E\u003Cstrong\u003EEvent Products:\u003C\u002Fstrong\u003E referee system (including onboard modules and the RoboMaster Champion), robot kits & accessories, RM Assistant product details, downloads, purchase & after-sales policies\u003C\u002Fli\u003E\u003Cli\u003E\u003Cstrong\u003ETechnical Assessment: \u003C\u002Fstrong\u003Emid-term & final robot assessment criteria, instructions for each stage\u003C\u002Fli\u003E\u003Cli\u003E\u003Cstrong\u003EEvent Promotion Kit:\u003C\u002Fstrong\u003E promotional material package\u003C\u002Fli\u003E\u003Cli\u003E\u003Cstrong\u003EEvent Sponsorship Guide:\u003C\u002Fstrong\u003E sponsorship guidelines\u003C\u002Fli\u003E\u003Cli\u003E\u003Cstrong\u003ELearning Labs: \u003C\u002Fstrong\u003Eparticipation guide, course salon, open-source materials\u003C\u002Fli\u003E\u003C\u002Ful\u003E\u003Cp\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Cp\u003E\u003
